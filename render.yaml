# Render Blueprint — deploys NEXORA as a free Static Site.
#
# How to use:
#   1. Push this repo to GitHub (or GitLab/Bitbucket).
#   2. In the Render dashboard: New -> Blueprint -> connect this repo.
#      Render will read this file automatically and set everything up.
#   3. After the first deploy, go to the service's Environment tab and add
#      VITE_PAYSTACK_PUBLIC_KEY (see .env.example) — it's marked "sync: false"
#      below so it is never committed to git, even though it's a public key.
#
# This is a pure static frontend today (mock data, no server). When a real
# backend (Supabase Edge Functions, etc.) is added, that runs on its own
# infrastructure — this file only needs to change if a Node/API service is
# added directly to this repo later.

services:
  - type: web
    name: nexora
    env: static
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
    routes:
      # Single-page app: let React Router handle all paths client-side.
      - type: rewrite
        source: /*
        destination: /index.html
